<style>
@font-face{font-family:Lilita;src:url(fonts/lilita-one-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;font-weight:400;src:url(fonts/figtree-latin-400-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;font-weight:600;src:url(fonts/figtree-latin-600-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;font-weight:700;src:url(fonts/figtree-latin-700-normal.woff2) format("woff2");font-display:swap}
@font-face{font-family:Figtree;font-weight:800;src:url(fonts/figtree-latin-800-normal.woff2) format("woff2");font-display:swap}

:root{
  --red:#D7261E; --red-ink:#B01C15; --red-soft:#FDE7E5;
  --mustard:#F2B705; --mustard-ink:#3B2A00;
  --green:#2F7D32;
  --ink:#2A1F1A; --muted:#7D6F66; --line:#F0E3DE; --soft:#F7EFEC; --table:#F6E9DF;
  --bg:#FFFFFF;
  --display:Lilita, "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:Figtree, system-ui, -apple-system, sans-serif;
  --tabs:calc(70px + env(safe-area-inset-bottom));
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);min-height:100dvh;overscroll-behavior-y:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding-bottom:calc(var(--tabs) + 20px)}
.icon{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- header ---------- */
.top{background:#fff;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.logo{font-family:var(--display);font-size:32px;line-height:1;color:var(--red);background:#fff;padding:4px 14px 7px;border-radius:14px;transform:rotate(-3deg);display:inline-block;box-shadow:0 0 0 1.5px var(--line),0 3px 0 var(--line)}
.roundbtn{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--ink);position:relative}
.dot{position:absolute;top:-2px;right:-3px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font:800 11px/18px var(--body);text-align:center}
.bar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:6px;min-height:58px;border-bottom:1px solid var(--line);margin-bottom:12px}
.bar h1{font-family:var(--display);font-weight:400;font-size:26px;line-height:1.1;flex:1;padding:0 6px}
.back{display:flex;align-items:center;gap:2px;font-weight:700;color:var(--red);padding:8px 8px 8px 2px}
.bar .side{min-width:70px;display:flex;justify-content:flex-end}

/* ---------- post ---------- */
.post{margin:0 12px 16px;background:#fff;border-radius:20px;box-shadow:0 0 0 1px var(--line),0 2px 0 var(--line);overflow:hidden}
.ph{display:flex;align-items:center;gap:10px;padding:12px 14px}
.who{min-width:0;flex:1;text-align:left}
.who b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who span{font-size:13px;color:var(--muted)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font:800 15px var(--body);color:#fff;overflow:hidden;background:var(--c,#C27C0E)}
.av img{width:100%;height:100%;object-fit:cover}
.pic{display:block;width:calc(100% - 20px);margin:0 10px;border-radius:16px;overflow:hidden;background:var(--table);aspect-ratio:4/3;position:relative}
.pic img,.pic svg{width:100%;height:100%;object-fit:cover;display:block}
.detail .pic{aspect-ratio:auto;min-height:200px}
.detail .pic img{height:auto;max-height:75vh;object-fit:contain;background:var(--table)}
.detail .pic svg{aspect-ratio:4/3;height:auto}
.body{padding:12px 14px 2px}
.dish{font-family:var(--display);font-size:26px;line-height:1.08;margin-bottom:8px;overflow-wrap:anywhere}
.badge{display:inline-flex;align-items:center;font:800 13px var(--body);padding:4px 11px;border-radius:99px;transform:rotate(-2deg)}
.badge.anbefales{background:var(--green);color:#fff}
.badge.spiseligt{background:var(--mustard);color:var(--mustard-ink)}
.note{font-size:15.5px;line-height:1.45;margin:10px 0 2px;white-space:pre-wrap;overflow-wrap:anywhere}
.acts{display:flex;align-items:center;gap:6px;padding:10px 12px 4px}
.haps{display:inline-flex;align-items:center;gap:7px;font:800 15px var(--body);padding:9px 16px;border-radius:99px;background:var(--red-soft);color:var(--red-ink);transition:transform .15s}
.haps.on{background:var(--red);color:#fff}
.haps:active{transform:scale(.94)}
.haps.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.14) rotate(-4deg)}}
.haps[disabled]{cursor:default}
.cbtn{display:inline-flex;align-items:center;gap:6px;font:700 15px var(--body);color:var(--muted);padding:9px 8px}
.edit{margin-left:auto;color:var(--muted);font-weight:700;font-size:14px;padding:9px 8px}
.whohapsed{display:block;width:100%;text-align:left;font-size:13.5px;color:var(--muted);padding:2px 14px 14px}
.whohapsed b{color:var(--ink);font-weight:700}
.nohaps{padding-bottom:14px}

/* ---------- comments ---------- */
.cms{padding:4px 0 0}
.cm{display:flex;gap:10px;padding:10px 16px}
.cm>button{align-self:flex-start}
.cm .av{width:32px;height:32px;font-size:13px}
.cm .txt{flex:1;min-width:0}
.cm .txt b{font-size:14.5px;font-weight:700}
.cm .txt time{font-size:12.5px;color:var(--muted);margin-left:4px}
.cm .txt p{font-size:15px;line-height:1.42;white-space:pre-wrap;overflow-wrap:anywhere}
.cm .del{font-size:12.5px;color:var(--muted);font-weight:700;padding:2px 0}
.cempty{color:var(--muted);font-size:14.5px;padding:6px 16px 10px}
.cform{position:sticky;bottom:calc(var(--tabs) + 8px);display:flex;gap:8px;align-items:flex-end;margin:10px 12px 0;padding:8px;background:#fff;border-radius:24px;box-shadow:0 0 0 1px var(--line),0 6px 18px rgba(42,31,26,.08)}
.cform textarea{flex:1;border:0;background:var(--soft);border-radius:18px;padding:10px 14px;resize:none;max-height:120px;font-size:16px;line-height:1.35;outline:none}
.send{flex:none;height:40px;padding:0 16px;border-radius:99px;background:var(--red);color:#fff;font-weight:800}
.send:disabled{opacity:.45}

/* ---------- buttons, forms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 20px;border-radius:99px;font-weight:800;font-size:15px;background:var(--soft);color:var(--ink)}
.btn.red{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn.small{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 2px var(--line)}
.btn:disabled{opacity:.5}
.field{display:block;margin:0 16px 16px}
.field>span{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
.field input,.field textarea{width:100%;border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font-size:16px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:96px;resize:vertical;line-height:1.4}
.field small{display:block;color:var(--muted);font-size:13px;margin-top:5px}
.err{color:var(--red-ink);font-size:14px;font-weight:700;margin:0 16px 12px}
.rates{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rate{border-radius:16px;padding:14px 10px;font:800 16px var(--body);border:2px solid var(--line);background:#fff;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:6px}
.rate .face{font-size:28px;line-height:1}
.rate[aria-pressed="true"].anbefales{background:var(--green);border-color:var(--green);color:#fff;transform:rotate(-1.5deg)}
.rate[aria-pressed="true"].spiseligt{background:var(--mustard);border-color:var(--mustard);color:var(--mustard-ink);transform:rotate(1.5deg)}
.photoPick{margin:0 16px 16px;border-radius:18px;overflow:hidden;background:var(--table);aspect-ratio:4/3;display:grid;place-items:center;position:relative;border:2px dashed #E7CFC3}
.photoPick img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photoPick .ph-in{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--red-ink);font-weight:800;text-align:center;padding:20px}
.photoPick .ph-in .icon{width:40px;height:40px}
.photoPick.has{border-style:solid;border-color:transparent}
.photoPick .chg{position:absolute;right:10px;bottom:10px;background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.photoPick .rm{position:absolute;left:10px;bottom:10px;background:#fff;border-radius:99px;padding:7px 14px;font-weight:800;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.formacts{display:flex;flex-direction:column;gap:10px;margin:6px 16px 0}
.danger{color:var(--red-ink);font-weight:800;padding:12px;text-align:center}

/* ---------- lists ---------- */
.sec{font-family:var(--display);font-weight:400;font-size:21px;margin:18px 16px 8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px}
.row .who b{font-size:16px}
.row .acts2{display:flex;gap:6px;flex:none}
.empty{margin:28px 24px;text-align:center;color:var(--muted)}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);margin-bottom:6px}
.empty .btn{margin-top:14px}
.search{margin:0 16px 6px;position:relative}
.search input{width:100%;border:0;background:var(--soft);border-radius:99px;padding:12px 16px 12px 44px;font-size:16px;outline:none}
.search .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);width:20px;height:20px}
.hint{color:var(--muted);font-size:14px;margin:4px 16px 8px}

/* ---------- notifications ---------- */
.nt{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left}
.nt.unread{background:#FFF6F5}
.nt .txt{flex:1;min-width:0;font-size:15px;line-height:1.35}
.nt .txt b{font-weight:800}
.nt .txt time{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.nt .thumb{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none;background:var(--table)}
.nt .thumb img,.nt .thumb svg{width:100%;height:100%;object-fit:cover}
.nt .kind{position:relative}
.nt .kind i{position:absolute;right:-5px;bottom:-5px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;border:2px solid #fff}
.nt .kind i svg{width:11px;height:11px;stroke:#fff;fill:none;stroke-width:2.6}
.nt .kind i svg.plate{width:15px;height:15px;color:#fff;stroke-linecap:round;stroke-linejoin:round}

/* ---------- profile ---------- */
.prof{padding:calc(18px + env(safe-area-inset-top)) 18px 12px;text-align:center;position:relative}
.prof .av{width:92px;height:92px;font-size:36px;margin:0 auto 10px}
.prof h2{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;overflow-wrap:anywhere}
.prof .un{color:var(--muted);font-size:15px;margin-top:2px}
.stats{display:flex;gap:26px;justify-content:center;margin:14px 0}
.stats div{font-size:13px;color:var(--muted)}
.stats b{display:block;font:800 21px var(--body);color:var(--ink)}
.prof .topleft{position:absolute;left:12px;top:calc(10px + env(safe-area-inset-top))}
.prof .topright{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top))}
.filters{display:flex;gap:8px;padding:8px 14px 12px;overflow-x:auto}
.chip{flex:none;padding:7px 13px;border-radius:99px;font:700 14px var(--body);color:var(--muted);background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:0 12px}
.tile{aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--table);position:relative}
.tile img,.tile svg{width:100%;height:100%;object-fit:cover}
.tile .tt{position:absolute;left:0;right:0;bottom:0;padding:16px 7px 6px;font:700 12px/1.2 var(--body);color:#fff;background:linear-gradient(transparent,rgba(42,31,26,.65));text-align:left;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tile .mk{position:absolute;top:6px;right:6px;width:12px;height:12px;border-radius:50%;box-shadow:0 0 0 2px #fff}
.mk.anbefales{background:var(--green)}.mk.spiseligt{background:var(--mustard)}
.locked{margin:24px;padding:24px;border-radius:20px;background:var(--soft);text-align:center;color:var(--muted)}
.locked b{display:block;color:var(--ink);font-family:var(--display);font-weight:400;font-size:22px;margin-bottom:4px}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs>div{max-width:560px;margin:0 auto;height:70px;display:flex;justify-content:space-around;align-items:center}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font:700 11px var(--body);color:var(--muted);min-width:56px;position:relative;padding:4px 0}
.tab[aria-current="page"]{color:var(--red)}
.tab .dot{top:-2px;right:8px}
.tab.add{width:58px;height:44px;border-radius:99px;background:var(--red);color:#fff;justify-content:center;min-width:0}
.tab.add .icon{width:26px;height:26px;stroke-width:2.6}

/* ---------- sheet, toast, overlay ---------- */
.scrim{position:fixed;inset:0;background:rgba(42,31,26,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:85vh;overflow:auto;padding:8px 0 calc(16px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 16px 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));z-index:80;max-width:536px;margin:0 auto;display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--ink);color:#fff;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.22);animation:drop .3s ease}
.toast .av{width:34px;height:34px;font-size:13px}
.toast small{display:block;opacity:.7;font-size:12.5px}
@keyframes drop{from{transform:translateY(-20px);opacity:0}}
.lb{position:fixed;inset:0;z-index:90;background:#140F0C;display:flex;align-items:center;justify-content:center;animation:fade .2s;touch-action:pinch-zoom}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center}

/* ---------- auth ---------- */
.auth{min-height:100dvh;display:flex;flex-direction:column}
.auth .top{justify-content:center;padding-top:calc(48px + env(safe-area-inset-top));padding-bottom:40px;margin-bottom:24px}
.auth .logo{font-size:56px;padding:8px 22px 12px;border-radius:20px}
.auth p.lead{margin:0 24px 22px;font-size:17px;text-align:center}
.auth .switch{display:flex;margin:0 16px 18px;background:var(--soft);border-radius:99px;padding:4px}
.auth .switch button{flex:1;padding:10px;border-radius:99px;font-weight:800;color:var(--muted)}
.auth .switch button[aria-pressed="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.auth form{max-width:560px;width:100%;margin:0 auto}
.auth .formacts{margin-bottom:28px}
.linkbtn{color:var(--red-ink);font-weight:700;padding:10px;text-align:center}

/* ---------- misc ---------- */
.loading{display:flex;justify-content:center;padding:40px}
.spinner{width:34px;height:34px;border-radius:50%;border:4px solid var(--red-soft);border-top-color:var(--red);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.banner{margin:0 12px 16px;padding:14px 16px;border-radius:18px;background:#FFF4D1;color:var(--mustard-ink)}
.banner p{font-size:15px;margin-bottom:10px}
.banner .row2{display:flex;gap:8px;flex-wrap:wrap}
.ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
.ptr .spinner{width:26px;height:26px;border-width:3px;margin-bottom:8px;animation:none}
.ptr.busy .spinner{animation:spin .8s linear infinite}
.ptr.anim{transition:height .25s}
.more{display:block;margin:8px auto 0;color:var(--muted);font-weight:700;padding:10px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

function plateSVG(seed){
  const pal = [["#6E3F22","#F0E2A8","#3F7D2B"],["#E3A92C","#F1E3C6","#4C8A2E"],["#C8572E","#EFC66E","#6FA83A"],["#D9822B","#F6E6C8","#3F7D2B"]];
  let h=0; for(const c of String(seed||"x")) h=(h*31+c.charCodeAt(0))|0; const p = pal[Math.abs(h)%pal.length];
  return `<svg viewBox="0 0 300 225" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="300" height="225" fill="#F6E9DF"/>
  <ellipse cx="156" cy="122" rx="104" ry="94" fill="rgba(0,0,0,.08)"/><circle cx="150" cy="115" r="96" fill="#FDFCF8"/><circle cx="150" cy="115" r="78" fill="#F6F3EC"/><circle cx="150" cy="115" r="76" fill="#FBFAF6"/>
  <path d="M112 92c22-18 60-14 70 10s-6 46-34 48-52-34-36-58z" fill="${p[0]}"/><ellipse cx="186" cy="132" rx="28" ry="22" fill="${p[1]}"/>
  <circle cx="132" cy="112" r="3" fill="${p[2]}"/><circle cx="150" cy="128" r="3" fill="${p[2]}"/><circle cx="160" cy="104" r="3" fill="${p[2]}"/>

}

/* ---------- tid ---------- */
function ago(ts){
  const d = new Date(ts), now = new Date(), s = (now - d)/1000;
  if(s < 60) return "Lige nu";
  if(s < 3600) return `For ${Math.floor(s/60)} min. siden`;
  const day = x => new Date(x.getFullYear(), x.getMonth(), x.getDate());
  const days = Math.round((day(now) - day(d)) / 864e5);
  if(days === 0) return s < 4*3600 ? `For ${Math.floor(s/3600)} ${Math.floor(s/3600)===1?"time":"timer"} siden` : (d.getHours() >= 16 ? "I aften" : "I dag");
  if(days === 1) return d.getHours() >= 16 ? "I aftes" : "I går";
  if(days < 7) return d.toLocaleDateString("da-DK",{weekday:"long"}).replace(/^./,c=>c.toUpperCase());
  return d.toLocaleDateString("da-DK",{day:"numeric",month:"short", year: d.getFullYear()!==now.getFullYear() ? "numeric" : undefined});
}
const shortAgo = ts => { const s=(Date.now()-new Date(ts))/1000; if(s<60) return "nu"; if(s<3600) return Math.floor(s/60)+" min"; if(s<86400) return Math.floor(s/3600)+" t"; if(s<7*86400) return Math.floor(s/86400)+" d"; return new Date(ts).toLocaleDateString("da-DK",{day:"numeric",month:"short"}); };

/* ---------- backend ---------- */
const MEAL_COLS = "id,user_id,title,rating,note,photo,created_at";
const PROF_COLS = "id,username,display_name,avatar";
function realApi(){
  const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth:{ persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, storageKey:"haps-auth" } });
  const fail = e => { if(e) throw e; };
  const urlCache = new Map();
  return {
    onAuth: cb => sb.auth.onAuthStateChange((ev,s)=>cb(ev,s)),
    async session(){ const { data } = await sb.auth.getSession(); return data.session; },
    async signUp({email,password,username,display_name}){ const { data, error } = await sb.auth.signUp({ email, password, options:{ data:{ username, display_name }, emailRedirectTo: location.origin + location.pathname } }); fail(error); return data; },
    async signIn(email,password){ const { data, error } = await sb.auth.signInWithPassword({ email, password }); fail(error); return data; },
    async reset(email){ const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname }); fail(error); },
    async updatePassword(password){ const { error } = await sb.auth.updateUser({ password }); fail(error); },
    async signOut(){ await sb.auth.signOut(); urlCache.clear(); },
    async usernameAvailable(name){ const { data, error } = await sb.rpc("username_available", { name }); fail(error); return !!data; },
    async profiles(ids){ if(!ids.length) return []; const { data, error } = await sb.from("profiles").select(PROF_COLS).in("id", ids); fail(error); return data||[]; },
    async profileByUsername(u){ const { data, error } = await sb.from("profiles").select(PROF_COLS).eq("username", u).maybeSingle(); fail(error); return data; },
    async updateProfile(id, patch){ const { error } = await sb.from("profiles").update(patch).eq("id", id); fail(error); },
    async searchUsers(q, myId){ const t = q.replace(/[%_,()]/g,""); const { data, error } = await sb.from("profiles").select(PROF_COLS).or(`username.ilike.${t}%,display_name.ilike.%${t}%`).neq("id", myId).order("username").limit(20); fail(error); return data||[]; },
    async feed(before){ let q = sb.from("meals").select(MEAL_COLS).order("created_at",{ascending:false}).limit(40); if(before) q = q.lt("created_at", before); const { data, error } = await q; fail(error); return data||[]; },
    async mealsOf(uid){ const { data, error } = await sb.from("meals").select(MEAL_COLS).eq("user_id", uid).order("created_at",{ascending:false}).limit(500); fail(error); return data||[]; },
    async meal(id){ const { data, error } = await sb.from("meals").select(MEAL_COLS).eq("id", id).maybeSingle(); fail(error); return data; },
    async mealsByIds(ids){ if(!ids.length) return []; const { data, error } = await sb.from("meals").select(MEAL_COLS).in("id", ids); fail(error); return data||[]; },
    async saveMeal(m){ const row = { title:m.title, rating:m.rating, note:m.note, photo:m.photo||"" };
      if(m.id){ const { data, error } = await sb.from("meals").update(row).eq("id", m.id).select(MEAL_COLS).single(); fail(error); return data; }
      const { data, error } = await sb.from("meals").insert(row).select(MEAL_COLS).single(); fail(error); return data; },
    async deleteMeal(m){ const { error } = await sb.from("meals").delete().eq("id", m.id); fail(error); if(m.photo) await sb.storage.from("photos").remove([m.photo]); },
    async uploadPhoto(path, blob){ const { error } = await sb.storage.from("photos").upload(path, blob, { contentType:"image/jpeg", upsert:false }); fail(error); },
    async removePhoto(path){ if(path) await sb.storage.from("photos").remove([path]); },
    async photoUrls(paths){
      const need = paths.filter(p=>p && !urlCache.has(p));
      if(need.length){ const { data, error } = await sb.storage.from("photos").createSignedUrls(need, 60*60*6); fail(error); (data||[]).forEach(d=>{ if(d.signedUrl) urlCache.set(d.path, d.signedUrl); }); }
      const out = {}; paths.forEach(p=>{ if(urlCache.has(p)) out[p]=urlCache.get(p); }); return out;
    },
    async uploadAvatar(path, blob){ const { error } = await sb.storage.from("avatars").upload(path, blob, { contentType:"image/jpeg", upsert:false }); fail(error); },
    async removeAvatar(path){ if(path) await sb.storage.from("avatars").remove([path]); },
    async haps(ids){ if(!ids.length) return []; const { data, error } = await sb.from("haps").select("meal_id,user_id,created_at").in("meal_id", ids).order("created_at"); fail(error); return data||[]; },
    async addHaps(mealId, myId){ const { error } = await sb.from("haps").insert({ meal_id:mealId, user_id:myId }); if(error && error.code!=="23505") fail(error); },
    async removeHaps(mealId, myId){ const { error } = await sb.from("haps").delete().eq("meal_id", mealId).eq("user_id", myId); fail(error); },
    async commentCounts(ids){ if(!ids.length) return {}; const { data, error } = await sb.from("comments").select("meal_id").in("meal_id", ids); fail(error); const o={}; (data||[]).forEach(r=>{ o[r.meal_id]=(o[r.meal_id]||0)+1; }); return o; },
    async comments(mealId){ const { data, error } = await sb.from("comments").select("id,meal_id,user_id,body,created_at").eq("meal_id", mealId).order("created_at"); fail(error); return data||[]; },
    async addComment(mealId, body, myId){ const { data, error } = await sb.from("comments").insert({ meal_id:mealId, body, user_id:myId }).select("id,meal_id,user_id,body,created_at").single(); fail(error); return data; },
    async deleteComment(id){ const { error } = await sb.from("comments").delete().eq("id", id); fail(error); },
    async friendships(){ const { data, error } = await sb.from("friendships").select("*"); fail(error); return data||[]; },
    async request(myId, otherId){ const { error } = await sb.from("friendships").insert({ requester:myId, addressee:otherId }); fail(error); },
    async accept(id){ const { error } = await sb.from("friendships").update({ status:"accepted" }).eq("id", id); fail(error); },
    async removeFriendship(id){ const { error } = await sb.from("friendships").delete().eq("id", id); fail(error); },
    async notifications(){ const { data, error } = await sb.from("notifications").select("*").order("created_at",{ascending:false}).limit(80); fail(error); return data||[]; },
    async markRead(){ const { error } = await sb.from("notifications").update({ read_at:new Date().toISOString() }).is("read_at", null); fail(error); },
    async savePush(s){ await sb.from("push_subscriptions").delete().eq("endpoint", s.endpoint); const { error } = await sb.from("push_subscriptions").insert(s); fail(error); },
    async deletePush(endpoint){ await sb.from("push_subscriptions").delete().eq("endpoint", endpoint); }
  };
}

async function ensurePeople(ids){

async function loadExtras(ids){

async function hydrate(root){
  const els = [...root.querySelectorAll("img[data-photo]")]; if(!els.length) return;
  let urls = {}; try{ urls = await api.photoUrls([...new Set(els.map(e=>e.dataset.photo))]); }catch(e){}
  els.forEach(el => { const u = urls[el.dataset.photo];
    const fallback = () => { const s = document.createElement("span"); s.innerHTML = plateSVG(el.dataset.photo); el.replaceWith(s.firstChild); };
    if(u){ el.addEventListener("error", fallback, {once:true}); el.src = u; } else fallback(); });
}
const photo = (m, alt) => m.photo ? `<img data-photo="${esc(m.photo)}" alt="${esc(alt||m.title)}" loading="lazy">` : plateSVG(m.id);

async function shrink(file, max){
  try{
    const bmp = await createImageBitmap(file, {imageOrientation:"from-image"});
    const k = Math.min(1, max/Math.max(bmp.width, bmp.height));
    const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width*k); cv.height = Math.round(bmp.height*k);
    cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
    return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",0.85));
  }catch(e){
    const im = new Image(); const url = URL.createObjectURL(file);
    await new Promise((res,rej)=>{ im.onload=res; im.onerror=rej; im.src=url; });
    const k = Math.min(1, max/Math.max(im.naturalWidth, im.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(im.naturalWidth*k); cv.height = Math.round(im.naturalHeight*k);
    cv.getContext("2d").drawImage(im, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
    return await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error("toBlob")),"image/jpeg",0.85));
  }
}

let toastT;
function toast(html, small){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role","status");
  t.innerHTML = typeof html === "string" ? `<div>${html}${small?`<small>${esc(small)}</small>`:""}</div>` : "";
  document.body.appendChild(t); clearTimeout(toastT); toastT = setTimeout(()=>t.remove(), 3000);
  t.onclick = () => t.remove();
  return t;
}
const say = msg => toast(esc(msg));
function sheet(html){

  document.body.appendChild(s);

  s.addEventListener("click", e => { if(e.target === s) close(); });
  return { el: s.querySelector(".sheet"), close };
}
function lightbox(src, alt){
  const lb = document.createElement("div"); lb.className = "lb"; lb.setAttribute("role","dialog"); lb.setAttribute("aria-modal","true");

async function toggleHaps(mealId, btn){
  const hs = hapsBy.get(mealId) || []; hapsBy.set(mealId, hs);
  const on = hs.includes(me.id);
  if(on) hs.splice(hs.indexOf(me.id),1); else hs.push(me.id);
  refreshPost(mealId, !on);
  try{ if(on) await api.removeHaps(mealId, me.id); else await api.addHaps(mealId, me.id); }
  catch(e){ if(on) hs.push(me.id); else hs.splice(hs.indexOf(me.id),1); refreshPost(mealId); say("Det lykkedes ikke. Tjek internettet og prøv igen."); }
}
function refreshPost(mealId, popped){
  document.querySelectorAll(`.post[data-meal="${CSS.escape(mealId)}"]`).forEach(el => {
    const detail = !!el.closest(".detail"), m = meals.get(mealId); if(!m) return;
    const keepImg = el.querySelector(".pic img[src]");

    const neu = tmp.firstElementChild;
    if(keepImg){ const slot = neu.querySelector(".pic img"); if(slot){ slot.replaceWith(keepImg); } }
    el.replaceWith(neu); hydrate(neu);
    if(popped){ const b = neu.querySelector("[data-haps]"); b.classList.add("pop"); }
  });
}

function setTab(t){
  document.querySelectorAll(".tab[data-tab]").forEach(a => { if(a.dataset.tab === t) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });

async function route(){
  if(!me) return;
  const h = decodeURIComponent(location.hash.slice(1)) || "feed";
  current = h;
  window.scrollTo(0,0);
  if(h === "feed"){ setTab("feed"); return renderFeed(); }
  if(h === "venner"){ setTab("venner"); return renderFriends(); }
  if(h === "haps"){ setTab("haps"); return renderNotes(); }
  if(h === "profil"){ setTab("profil"); return renderProfile(me.username); }
  if(h === "ny"){ setTab(""); return renderForm(null); }
  if(h.startsWith("ret-")){ setTab(""); return renderForm(h.slice(4)); }
  if(h.startsWith("meal-")){ setTab(""); return renderMeal(h.slice(5)); }
  if(h.startsWith("u-")){ const u = h.slice(2); setTab(u === me.username ? "profil" : ""); return renderProfile(u); }
  location.replace("#feed");
}

function paintFeed(){

    const hasFriends = friendIds().length > 0;

async function renderMeal(id){
  app.innerHTML = `<div class="wrap detail"><div class="bar">${backBtn()}<h1></h1></div><div id="mealBox">${loading()}</div></div>`;
  let m;
  try{
    m = await api.meal(id);
    if(!m){ $("#mealBox").innerHTML = `<div class="empty"><b>Opslaget findes ikke</b>Det er måske slettet, eller I er ikke venner længere.</div>`; return; }
    meals.set(m.id, m);
    const [cs] = await Promise.all([api.comments(id), loadExtras([id])]);
    await ensurePeople([m.user_id, ...cs.map(c=>c.user_id)]);
    ccount[id] = cs.length;
    if(current !== "meal-"+id) return;
    paintMeal(m, cs);
  }catch(e){ if(current === "meal-"+id) $("#mealBox").innerHTML = `<div class="empty"><b>Opslaget kunne ikke hentes</b>Tjek internettet og prøv igen.</div>`; }
}
function paintMeal(m, cs){
  const box = $("#mealBox");
  const canDel = c => c.user_id === me.id || m.user_id === me.id;
  box.innerHTML = postHTML(m, true) + `<div class="cms" id="cms">${cs.length ? cs.map(c=>{ const p = personOf(c.user_id); return `<div class="cm" data-c="${c.id}"><button type="button" data-go="#u-${esc(p.username)}" aria-label="${esc(nameOf(p))}">${av(p)}</button><div class="txt"><b>${esc(c.user_id===me.id?"Dig":nameOf(p))}</b><time>${esc(shortAgo(c.created_at))}</time><p>${esc(c.body)}</p>${canDel(c)?`<button class="del" type="button" data-delc="${c.id}">Slet</button>`:""}</div></div>`; }).join("") : `<p class="cempty">Ingen kommentarer endnu.</p>`}</div>
    <form class="cform" id="cform"><textarea rows="1" maxlength="1000" placeholder="Skriv en kommentar …" aria-label="Kommentar"></textarea><button class="send" type="submit" disabled>Send</button></form>`;
  hydrate(box);
  const f = $("#cform"), ta = f.querySelector("textarea"), send = f.querySelector(".send");
  ta.addEventListener("input", () => { send.disabled = !ta.value.trim(); ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; });
  f.onsubmit = async e => {
    e.preventDefault(); const body = ta.value.trim(); if(!body) return;
    send.disabled = true;
    try{ const c = await api.addComment(m.id, body, me.id); cs.push(c); ccount[m.id] = cs.length; paintMeal(m, cs); window.scrollTo(0, document.body.scrollHeight); }
    catch(err){ send.disabled = false; say("Kommentaren blev ikke sendt. Prøv igen."); }
  };
  box.querySelectorAll("[data-delc]").forEach(b => b.onclick = async () => {
    if(!confirm("Slet kommentaren?")) return;
    const cid = +b.dataset.delc;
    try{ await api.deleteComment(cid); const i = cs.findIndex(c=>c.id===cid); cs.splice(i,1); ccount[m.id] = cs.length; paintMeal(m, cs); }
    catch(err){ say("Kommentaren blev ikke slettet."); }
  });
}

  document.querySelectorAll(".rate").forEach(b => b.onclick = () => { m.rating = b.dataset.r; document.querySelectorAll(".rate").forEach(x => x.setAttribute("aria-pressed", x===b)); });
  const err = msg => { const e = $("#err"); e.textContent = msg; e.hidden = !msg; };

  document.querySelectorAll(".rate").forEach(b => b.addEventListener("click", () => err("")));
  $("#mf").onsubmit = async e => {
    e.preventDefault(); if(busy) return;

    if(!title){ err("Skriv hvad du fik at spise."); $("#title").focus(); return; }
    if(!m.rating){ err("Vælg om den kan anbefales eller er spiselig."); return; }
    err(""); busy = true; const btn = $("#save"); btn.disabled = true; btn.textContent = blob ? "Lægger billedet op …" : "Gemmer …";
    let newPath = "";
    try{
      const old = m.photo || "";
      if(blob){ newPath = `${me.id}/${uid()}.jpg`; await api.uploadPhoto(newPath, blob); }
      const photoPath = blob ? newPath : (removePhoto ? "" : old);
      const saved = await api.saveMeal({ id: editId || null, title, rating: m.rating, note, photo: photoPath });
      if(old && old !== photoPath) api.removePhoto(old).catch(()=>{});
      meals.set(saved.id, saved);
      if(!editId){ feedIds.unshift(saved.id); hapsBy.set(saved.id, []); ccount[saved.id] = 0; }
      say(editId ? "Ændringerne er gemt." : "Din aftensmad er delt.");
      location.replace(editId ? "#meal-"+saved.id : "#feed");
    }catch(ex){
      if(newPath) api.removePhoto(newPath).catch(()=>{});
      busy = false; btn.disabled = false; btn.textContent = editId ? "Gem ændringer" : "Del aftensmad";
      err("Det blev ikke gemt. Tjek internettet og prøv igen.");
    }
  };
  const del = $("#del"); if(del) del.onclick = async () => {
    if(!confirm("Slet opslaget? Haps og kommentarer forsvinder også.")) return;
    try{ await api.deleteMeal(m); meals.delete(m.id); feedIds = feedIds.filter(x=>x!==m.id); say("Opslaget er slettet."); location.replace("#profil"); }
    catch(ex){ say("Opslaget blev ikke slettet. Prøv igen."); }
  };
}

/* ---------- push ---------- */
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const b64ToBytes = b64 => { const p = "=".repeat((4 - b64.length % 4) % 4); const raw = atob((b64 + p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(raw, c=>c.charCodeAt(0)); };
async function currentSub(){ if(!pushSupported()) return null; const reg = await navigator.serviceWorker.getRegistration(); return reg ? await reg.pushManager.getSubscription() : null; }
async function enablePush(){
  if(!pushSupported()) return false;
  const perm = await Notification.requestPermission(); if(perm !== "granted") return false;
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToBytes(VAPID_PUBLIC) });
  const j = sub.toJSON();
  await api.savePush({ user_id: me.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
  lsSet("hapsPushAsked","1"); return true;
}
async function disablePush(quiet){ try{ const sub = await currentSub(); if(sub){ await api.deletePush(sub.endpoint); await sub.unsubscribe(); } }catch(e){ if(!quiet) say("Kunne ikke slå notifikationer fra."); } }
async function renderPush(root){
  const txt = root.querySelector("#pushTxt"), btn = root.querySelector("#pushBtn");
  if(DEMO){ txt.textContent = "Få besked, når nogen hapser din mad."; btn.hidden = false; btn.textContent = "Slå notifikationer til"; btn.className = "btn red"; return; }
  if(!pushSupported()){
    txt.textContent = /iPhone|iPad/.test(navigator.userAgent) && !isStandalone()
      ? "På iPhone virker notifikationer kun, når Haps er lagt på hjemmeskærmen. Åbn den derfra for at slå dem til."
      : "Notifikationer virker ikke i denne browser."; btn.hidden = true; return; }
  if(Notification.permission === "denied"){ txt.textContent = "Notifikationer er slået fra for Haps. Slå dem til under Indstillinger → Notifikationer → Haps på telefonen."; btn.hidden = true; return; }
  const sub = await currentSub().catch(()=>null); btn.hidden = false;
  if(sub && Notification.permission === "granted"){ txt.textContent = "Slået til på denne telefon. Du får besked om haps, kommentarer, venner og ny aftensmad fra dine venner."; btn.textContent = "Slå notifikationer fra"; btn.className = "btn"; btn.dataset.on = "1"; }
  else { txt.textContent = "Få besked, når nogen hapser din mad, kommenterer, eller når dine venner deler aftensmad."; btn.textContent = "Slå notifikationer til"; btn.className = "btn red"; btn.dataset.on = ""; }
  btn.onclick = async () => { btn.disabled = true;
    try{ if(btn.dataset.on){ await disablePush(); say("Notifikationer er slået fra."); } else if(await enablePush()) say("Notifikationer er slået til."); else say("Notifikationer blev ikke slået til."); }
    catch(e){ say("Det lykkedes ikke. Prøv igen."); }
    btn.disabled = false; renderPush(root); };
}
function pushBanner(){
  const box = $("#pushBox");
  if(!box || DEMO || !pushSupported() || Notification.permission !== "default" || lsGet("hapsPushAsked") || !feedIds.length) return;
  box.innerHTML = `<div class="banner"><p><b>Vil du vide, når nogen hapser din mad?</b> Slå notifikationer til, så får du besked.</p><div class="row2"><button class="btn small red" type="button" data-pyes>Slå til</button><button class="btn small" type="button" data-pno>Ikke nu</button></div></div>`;
  box.querySelector("[data-pno]").onclick = () => { lsSet("hapsPushAsked","1"); box.innerHTML = ""; };
  box.querySelector("[data-pyes]").onclick = async () => { try{ say(await enablePush() ? "Notifikationer er slået til." : "Notifikationer blev ikke slået til."); }catch(e){ say("Det lykkedes ikke. Prøv under Profil → Indstillinger."); } lsSet("hapsPushAsked","1"); box.innerHTML = ""; };
}
if("serviceWorker" in navigator){ navigator.serviceWorker.addEventListener("message", e => { if(e.data && e.data.type === "open" && me){ const h = String(e.data.url||"").split("#")[1]; if(h) location.hash = "#"+h; } }); }

/* ---------- træk ned for at opdatere ---------- */
async function refreshFeed(){ try{ await loadFeed(); await loadNotes().catch(()=>{}); if(current === "feed") paintFeed(); }catch(e){} }
(function pull(){
  let y0 = null, d = 0, busy = false;
  const box = () => current === "feed" ? $(".ptr") : null;
  window.addEventListener("touchstart", e => { if(busy || window.scrollY > 0 || !box() || document.querySelector(".scrim,.lb")) { y0 = null; return; } y0 = e.touches[0].clientY; d = 0; }, {passive:true});
  window.addEventListener("touchmove", e => { if(y0 === null) return; d = Math.max(0, Math.min(90, (e.touches[0].clientY - y0) * .5)); const b = box(); if(b){ b.classList.remove("anim"); b.style.height = d + "px"; b.querySelector(".spinner").style.transform = `rotate(${d*4}deg)`; } }, {passive:true});
  window.addEventListener("touchend", async () => {
    if(y0 === null) return; y0 = null; const b = box(); if(!b) return;
    b.classList.add("anim");
    if(d < 60){ b.style.height = "0px"; return; }
    busy = true; b.style.height = "48px"; b.classList.add("busy");
    await refreshFeed();
    const b2 = box(); if(b2){ b2.classList.add("anim"); b2.style.height = "0px"; b2.classList.remove("busy"); } busy = false;
  });
})();

/* ---------- login ---------- */
function renderAuth(mode){
  mode = mode || "in";
  $("#tabs").hidden = true;
  app.innerHTML = `<div class="auth"><header class="top"><span class="logo">Haps</span></header>
    <p class="lead">Del din aftensmad, og se hvad dine venner spiser.</p>
    <div class="switch" role="group"><button type="button" data-m="in" aria-pressed="${mode==="in"}">Log ind</button><button type="button" data-m="up" aria-pressed="${mode==="up"}">Opret konto</button></div>
    <form id="af" novalidate>
      ${mode==="up" ? `<label class="field"><span>Dit navn</span><input id="an" maxlength="40" autocomplete="name" placeholder="Fx Kasper"></label>
      <label class="field"><span>Brugernavn</span><input id="au" maxlength="24" autocapitalize="none" autocomplete="username" placeholder="fx kasper"><small>Dine venner finder dig med det. Små bogstaver, tal, punktum og bundstreg.</small></label>` : ""}
      <label class="field"><span>E-mail</span><input id="ae" type="email" autocomplete="email" autocapitalize="none" inputmode="email"></label>
      ${mode!=="reset" ? `<label class="field"><span>Adgangskode</span><input id="ap" type="password" autocomplete="${mode==="up"?"new-password":"current-password"}">${mode==="up"?"<small>Mindst 6 tegn.</small>":""}</label>` : ""}
      <p class="err" id="aerr" hidden></p>
      <div class="formacts"><button class="btn red full" type="submit" id="ago">${mode==="up" ? "Opret konto" : mode==="reset" ? "Send link til ny adgangskode" : "Log ind"}</button>
      ${mode==="in" ? `<button class="linkbtn" type="button" data-m="reset">Glemt adgangskode?</button>` : mode==="reset" ? `<button class="linkbtn" type="button" data-m="in">Tilbage til log ind</button>` : ""}</div>
    </form></div>`;
  app.querySelectorAll("[data-m]").forEach(b => b.onclick = () => renderAuth(b.dataset.m));
  if(mode==="reset") app.querySelector(".switch").hidden = true;
  const err = m => { const e = $("#aerr"); e.textContent = m; e.hidden = !m; };
  $("#af").onsubmit = async e => {
    e.preventDefault();
    const email = $("#ae").value.trim(), pass = $("#ap") ? $("#ap").value : "";
    const btn = $("#ago"), label = btn.textContent;
    if(!/^\S+@\S+\.\S+$/.test(email)){ err("Skriv en gyldig e-mailadresse."); return; }
    btn.disabled = true; btn.textContent = "Et øjeblik …"; err("");
    try{
      if(mode === "reset"){ await api.reset(email); err(""); say("Tjek din mail for et link til en ny adgangskode."); renderAuth("in"); return; }
      if(mode === "up"){
        const name = $("#an").value.trim(), un = $("#au").value.trim().toLowerCase();
        if(!name){ throw {msg:"Skriv dit navn."}; }
        if(!/^[a-z0-9_.æøå]{3,24}$/.test(un)) throw {msg:"Brugernavnet skal være 3–24 tegn: små bogstaver, tal, punktum eller bundstreg."};
        if(pass.length < 6) throw {msg:"Adgangskoden skal være mindst 6 tegn."};
        if(!(await api.usernameAvailable(un))) throw {msg:"Det brugernavn er taget. Prøv et andet."};
        const r = await api.signUp({ email, password:pass, username:un, display_name:name });
        if(!r.session){ err(""); say("Tjek din mail og tryk på linket for at bekræfte kontoen."); renderAuth("in"); }
        return;
      }
      await api.signIn(email, pass);
    }catch(ex){
      btn.disabled = false; btn.textContent = label;
      const m = ex && (ex.msg || ex.message || "");
      err(ex.msg ? ex.msg : /invalid login/i.test(m) ? "Forkert e-mail eller adgangskode." : /already registered|already been registered/i.test(m) ? "Der findes allerede en konto med den e-mail. Log ind i stedet." : /not confirmed/i.test(m) ? "Bekræft din e-mail først. Tjek din indbakke." : /rate limit|too many/i.test(m) ? "For mange forsøg. Vent et par minutter." : "Det lykkedes ikke. Tjek internettet og prøv igen.");
    }
  };
}
function renderNewPassword(){
  $("#tabs").hidden = true;
  app.innerHTML = `<div class="auth"><header class="top"><span class="logo">Haps</span></header><p class="lead">Vælg en ny adgangskode.</p>
    <form id="npf"><label class="field"><span>Ny adgangskode</span><input id="np" type="password" autocomplete="new-password"><small>Mindst 6 tegn.</small></label><p class="err" id="nperr" hidden></p>
    <div class="formacts"><button class="btn red full" type="submit">Gem adgangskode</button></div></form></div>`;
  $("#npf").onsubmit = async e => { e.preventDefault(); const v = $("#np").value; const er = $("#nperr");
    if(v.length < 6){ er.textContent = "Mindst 6 tegn."; er.hidden = false; return; }
    try{ await api.updatePassword(v); say("Din adgangskode er skiftet."); recovering = false; start(); }catch(ex){ er.textContent = "Det lykkedes ikke. Prøv igen."; er.hidden = false; } };
}

/* ---------- start ---------- */
let recovering = false, started = false;
async function start(){
  const s = await api.session().catch(()=>null);
  if(!s){ me = null; started = false; renderAuth(); return; }
  if(recovering){ renderNewPassword(); return; }
  if(started && me && me.id === s.user.id) return;
  app.innerHTML = `<div class="wrap" style="padding-top:40vh">${loading()}</div>`;
  try{
    let p = (await api.profiles([s.user.id]))[0];
    if(!p){ await new Promise(r=>setTimeout(r,800)); p = (await api.profiles([s.user.id]))[0]; }
    if(!p) throw new Error("no profile");
    me = p; people.set(me.id, me); started = true;
    $("#tabs").hidden = false;
    loadNotes().then(()=>{ if(notes.length) lastNoteId = Math.max(...notes.map(n=>n.id)); }).catch(()=>{});
    const h = location.hash.slice(1);
    if(!h || h === "demo" || /access_token|type=/.test(h)) history.replaceState(null, "", location.pathname + "#feed");
    route();
  }catch(e){
    app.innerHTML = `<div class="wrap"><div class="empty" style="margin-top:30vh"><b>Haps kunne ikke starte</b>Tjek internettet og prøv igen.<br><button class="btn red" type="button" id="retry">Prøv igen</button></div></div>`;
    $("#retry").onclick = start;
  }
}
api.onAuth((ev) => {
  if(ev === "PASSWORD_RECOVERY"){ recovering = true; renderNewPassword(); return; }
  if(ev === "SIGNED_OUT"){ me = null; started = false; feedLoaded = false; feedIds = []; meals.clear(); notes = []; lastNoteId = 0; friendships = []; renderAuth(); return; }
  if(ev === "SIGNED_IN") setTimeout(start, 0);
});
start();

if("serviceWorker" in navigator && !DEMO){ window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); }); }
})();
</script>
